<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <marker id="arrow-solid" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#1e293b" />
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#0284c7" />
    </marker>
    
    <linearGradient id="harbingerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    
    <linearGradient id="postgresGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#336791" />
      <stop offset="100%" stop-color="#21496b" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="20" y="20" width="760" height="610" rx="24" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)"/>
  
  <rect x="230" y="140" width="280" height="420" rx="20" fill="#f0fdf4" stroke="#22c55e" stroke-width="2" stroke-dasharray="6,6"/>

  <g transform="translate(320, 45)">
    <circle cx="50" cy="35" r="28" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
    <circle cx="50" cy="28" r="10" fill="#0284c7"/>
    <path d="M 36 48 A 15 12 0 0 1 64 48 Z" fill="#0284c7"/>
    <rect x="30" y="52" width="40" height="4" rx="2" fill="#64748b"/>
    <text x="50" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#1e293b">Users</text>
  </g>

  <g transform="translate(560, 45)">
    <circle cx="50" cy="35" r="28" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="50" cy="28" r="10" fill="#d97706"/>
    <path d="M 36 48 A 15 12 0 0 1 64 48 Z" fill="#d97706"/>
    <rect x="30" y="52" width="40" height="4" rx="2" fill="#64748b"/>
    <text x="50" y="78" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#1e293b">Contacts</text>
  </g>

  <g transform="translate(265, 175)">
    <rect x="0" y="0" width="210" height="120" rx="16" fill="url(#harbingerGrad)" filter="url(#shadow)"/>
    <path d="M 50 48 A 12 12 0 0 1 64 34" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M 44 48 A 18 18 0 0 1 68 28" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="58" cy="54" r="5" fill="#ffffff"/>
    <text x="115" y="56" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="19" fill="#ffffff" letter-spacing="1">HARBINGER</text>
    <text x="105" y="90" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="13" fill="#e0f2fe">Messaging Core &amp; Web UI</text>
  </g>

  <g transform="translate(325, 410)">
    <path d="M 10 30 C 10 15, 80 15, 80 30 L 80 90 C 80 105, 10 105, 10 90 Z" fill="url(#postgresGrad)" filter="url(#shadow)"/>
    <ellipse cx="45" cy="30" rx="35" ry="14" fill="#4682b4" stroke="#6ba2cd" stroke-width="2"/>
    <path d="M 10 50 C 10 65, 80 65, 80 50" fill="none" stroke="#21496b" stroke-width="2" opacity="0.6"/>
    <path d="M 10 70 C 10 85, 80 85, 80 70" fill="none" stroke="#21496b" stroke-width="2" opacity="0.6"/>
    <rect x="25" y="52" width="40" height="20" rx="4" fill="#ffffff" opacity="0.9"/>
    <text x="45" y="66" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" fill="#1e293b">SQL</text>
    <text x="45" y="125" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="15" fill="#1e293b">PostgreSQL</text>
  </g>

  <line x1="370" y1="125" x2="370" y2="168" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow-solid)"/>
  <line x1="370" y1="300" x2="370" y2="400" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arrow-solid)"/>
  <path d="M 440 200 L 590 120" fill="none" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5,5" marker-end="url(#arrow-dashed)"/>

  <text x="545" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#0284c7">WhatsApp / SMS</text>
  <text x="382" y="150" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#64748b">HTTPS / TLS 1.3</text>
  <text x="382" y="355" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#64748b">AES-256 Storage</text>
</svg>